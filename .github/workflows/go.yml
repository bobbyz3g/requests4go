name: test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod

    - name: Get dependencies
      run: go mod download

    - name: Test
      run: go test -race ./...

    - name: Vet
      run: go vet ./...
